<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 3 · Lesson 1, part 2 · Travel vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2A43;--cream:#FFF8EC;--coral:#E8553D;--teal:#12A594;--sun:#F5B700;--sky:#9FD8FF}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--cream);font-family:'Fredoka',system-ui,sans-serif;padding:16px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top small{color:var(--sky);letter-spacing:2px}.top h1{margin:0;font-size:clamp(24px,4vw,34px)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav span{color:var(--sky)}
.nav button{border:3px solid var(--sky);background:transparent;color:var(--cream);border-radius:999px;padding:6px 16px;font-size:17px;font-weight:600}
.nav button.on{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.card{background:var(--cream);color:var(--navy);border-radius:26px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:14px;animation:pop .4s}
.card h2{margin:0;font-size:clamp(20px,3vw,28px)}.meta{display:flex;justify-content:space-between;font-weight:600;font-size:18px;flex-wrap:wrap}
.q{font-size:clamp(22px,3.4vw,32px);font-weight:700;line-height:1.35}.q b{color:var(--coral)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.o{display:flex;align-items:center;justify-content:center;gap:12px;border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:18px;padding:14px;font-size:clamp(18px,2.6vw,25px);font-weight:600}
.o.ok{background:#8FE3CF;animation:pop .4s}.o.bad{background:#FFB4A2;animation:shake .4s}.o:disabled{cursor:default}
.ic{background:#fff;border-radius:12px;flex:none}.fb{font-size:22px;font-weight:600;min-height:30px}
.go{align-self:flex-end;background:var(--navy);color:var(--cream);border:0;border-radius:999px;padding:12px 32px;font-size:21px;font-weight:700}
.go.alt{background:var(--coral);color:var(--navy)}.go[disabled]{opacity:.35}
.row{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.big{display:flex;justify-content:center}
.box{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:12px 20px;font-size:clamp(18px,2.4vw,22px);line-height:1.8}.box b{color:var(--coral)}
.learn{background:var(--sky);border-radius:16px;padding:10px 18px;font-size:19px}
.mt{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:700px){.mt{grid-template-columns:1fr}}
.s{display:block;width:100%;text-align:left;border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;padding:10px 14px;font-size:clamp(17px,2.2vw,21px);margin-bottom:8px}
.s.sel{background:var(--sun)}.s.done{background:#8FE3CF}.s b{color:var(--coral)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.t{border:3px solid var(--navy);background:#fff;border-radius:16px;padding:8px;color:var(--navy);font-weight:700;font-size:20px}
.t.done{opacity:.35}.t.shake{animation:shake .4s;background:#FFB4A2}
.cz{display:grid;grid-template-columns:40px repeat(3,1fr);gap:8px;align-items:center}.cz .o{padding:6px 10px;justify-content:flex-start;border-color:transparent;font-size:clamp(17px,2.2vw,22px)}.cz .o.sel{border-color:var(--navy)}
.dot{width:26px;height:16px;border:3px solid var(--navy);border-radius:50%;background:#fff;flex:none}.sel .dot{background:var(--navy)}
.credit{text-align:right;font-size:15px}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-suitcase" viewBox="0 0 64 64"><rect x="10" y="20" width="44" height="32" rx="5" fill="#E8553D"/><path d="M24 20v-6h16v6" fill="none" stroke="#0F2A43" stroke-width="3"/><rect x="18" y="20" width="4" height="32" fill="#B93A26"/><rect x="42" y="20" width="4" height="32" fill="#B93A26"/></symbol>
<symbol id="i-passport" viewBox="0 0 64 64"><rect x="16" y="8" width="32" height="48" rx="4" fill="#12457A"/><circle cx="32" cy="27" r="9" fill="none" stroke="#F5B700" stroke-width="2.5"/><path d="M23 27h18M32 18v18" stroke="#F5B700" stroke-width="2"/><rect x="22" y="43" width="20" height="4" rx="2" fill="#F5B700"/></symbol>
<symbol id="i-guidebook" viewBox="0 0 64 64"><rect x="12" y="10" width="40" height="44" rx="4" fill="#12A594"/><rect x="18" y="16" width="28" height="22" rx="2" fill="#FFF8EC"/><path d="M32 34c-6-7-6-12 0-12s6 5 0 12z" fill="#E8553D"/><rect x="18" y="43" width="22" height="3" fill="#FFF8EC"/></symbol>
<symbol id="i-flip-flops" viewBox="0 0 64 64"><ellipse cx="22" cy="34" rx="9" ry="20" fill="#F5B700"/><ellipse cx="42" cy="34" rx="9" ry="20" fill="#F5B700"/><path d="M22 22v10M22 32l-6 6M22 32l6 6M42 22v10M42 32l-6 6M42 32l6 6" stroke="#E8553D" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
<symbol id="i-raincoat" viewBox="0 0 64 64"><path d="M20 14c4-6 20-6 24 0l10 12-6 4v24H16V30l-6-4z" fill="#F5B700"/><path d="M24 14c4 6 12 6 16 0" fill="none" stroke="#0F2A43" stroke-width="2.5"/><path d="M32 22v34" stroke="#0F2A43" stroke-width="2.5"/></symbol>
<symbol id="i-toothbrush" viewBox="0 0 64 64"><path d="M10 52L38 28" stroke="#12A594" stroke-width="8" stroke-linecap="round"/><path d="M40 26l12-10" stroke="#9FD8FF" stroke-width="10" stroke-linecap="round"/><path d="M44 12l6 6M50 8l6 6" stroke="#E8553D" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="i-washbag" viewBox="0 0 64 64"><path d="M22 24c0-10 20-10 20 0" fill="none" stroke="#0F2A43" stroke-width="3"/><rect x="8" y="22" width="48" height="30" rx="12" fill="#9FD8FF" stroke="#0F2A43" stroke-width="2.5"/><path d="M14 32h36" stroke="#0F2A43" stroke-width="3" stroke-dasharray="4 3"/><rect x="28" y="28" width="8" height="8" rx="2" fill="#E8553D"/></symbol>
<symbol id="i-charger" viewBox="0 0 64 64"><rect x="24" y="4" width="4" height="10" fill="#E8553D"/><rect x="36" y="4" width="4" height="10" fill="#E8553D"/><rect x="20" y="14" width="24" height="22" rx="5" fill="#0F2A43"/><path d="M32 36v10c0 8 12 6 12 14" stroke="#0F2A43" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
<symbol id="i-soap" viewBox="0 0 64 64"><rect x="8" y="28" width="38" height="24" rx="10" fill="#F5B700"/><circle cx="50" cy="18" r="6" fill="none" stroke="#12A594" stroke-width="2.5"/><circle cx="40" cy="12" r="4" fill="none" stroke="#12A594" stroke-width="2.5"/><circle cx="55" cy="34" r="3" fill="none" stroke="#12A594" stroke-width="2.5"/></symbol>
<symbol id="i-pillow" viewBox="0 0 64 64"><path d="M10 18c14-6 30-6 44 0 4 14 4 14 0 28-14 6-30 6-44 0-4-14-4-14 0-28z" fill="#9FD8FF" stroke="#0F2A43" stroke-width="2.5"/><path d="M18 24l4 4M46 24l-4 4M18 42l4-4M46 42l-4-4" stroke="#0F2A43" stroke-width="2.5" stroke-linecap="round"/></symbol>
<symbol id="i-umbrella" viewBox="0 0 64 64"><path d="M6 32C8 10 56 10 58 32c-5-5-9-5-13 0-4-5-9-5-13 0-4-5-9-5-13 0-4-5-9-5-13 0z" fill="#E8553D"/><path d="M32 30v20c0 6-8 6-8 1" stroke="#0F2A43" stroke-width="3.5" fill="none" stroke-linecap="round"/></symbol>
<symbol id="i-medicine" viewBox="0 0 64 64"><rect x="18" y="22" width="28" height="34" rx="6" fill="#12A594"/><rect x="22" y="12" width="20" height="10" rx="3" fill="#0F2A43"/><rect x="22" y="32" width="20" height="14" rx="2" fill="#FFF8EC"/><path d="M32 34v10M27 39h10" stroke="#E8553D" stroke-width="3"/></symbol>
</defs></svg>
<div class="wrap">
<div class="top"><div><small>UNIT 3 · TRAVEL · LESSON 1, PART 2</small><h1>Holiday Equipment: Practice</h1></div><div style="text-align:right"><b id="stars"></b><br><small style="letter-spacing:0">Lesson time: 25 minutes</small></div></div>
<div class="nav" id="nav"></div>
<div id="main"></div>
</div>
<script>
const W=a=>a.map(t=>({t,p:t}));const N=a=>a.map(t=>({t}));
const ic=(k,s=56)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-'+(k==='medicines'?'medicine':k)+'"/></svg>';
const A=[
{n:'1 · Peep through the keyhole',min:3,type:'key',q:[{p:'umbrella',o:N(['pillow','umbrella','soap']),a:1},{p:'passport',o:N(['passport','suitcase','washbag']),a:0},{p:'pillow',o:N(['charger','toothbrush','pillow']),a:2},{p:'suitcase',o:N(['raincoat','guidebook','suitcase']),a:2}]},
{n:'2 · Definitions',min:5,type:'mc',q:[
{pr:'___ is something you use to wash your body in the shower.',o:W(['soap','pillow','charger']),a:0},
{pr:'A ___ makes sleeping on a plane more comfortable.',o:W(['passport','pillow','umbrella']),a:1},
{pr:'A ___ has your photo in it. You carry it for identification.',o:W(['suitcase','passport','washbag']),a:1},
{pr:'You wear a ___ to stay dry when the weather is wet.',o:W(['flip-flops','raincoat','toothbrush']),a:1},
{pr:'A ___ carries all your clothes when you go on holiday.',o:W(['suitcase','guidebook','soap']),a:0},
{pr:'You use a ___ to clean your teeth every day.',o:W(['toothbrush','charger','pillow']),a:0}]},
{n:'3 · Match',min:6,type:'match'},
{n:'4 · Everyday sentences',min:4,type:'mc',info:true,q:[
{p:'suitcase',pr:'Choose the sentence that describes an everyday situation.',o:N(['I have a red suitcase that I always take on holiday.','I eat my suitcase for breakfast.','I wash my hands with a suitcase.']),a:0},
{p:'pillow',pr:'Choose the sentence that describes an everyday situation.',o:N(['I write my homework with a pillow.','I sleep with a soft pillow every night.','I wear my pillow on my feet.']),a:1},
{p:'soap',pr:'Choose the sentence that describes an everyday situation.',o:N(['I drink soap with my breakfast.','I read soap on the bus.','I use soap to wash my hands before lunch.']),a:2},
{p:'passport',pr:'Choose the sentence that describes an everyday situation.',o:N(['I clean my teeth with a passport.','I show my passport at the airport.','I sleep under my passport.']),a:1},
{p:'raincoat',pr:'Choose the sentence that describes an everyday situation.',o:N(['I wear a raincoat when it rains.','I swim in my raincoat.','I eat my raincoat.']),a:0}]},
{n:'5 · Correct the teacher',min:3,type:'mc',teach:true,q:[
{p:'suitcase',w:'umbrella',o:N(['suitcase','pillow','soap']),a:0},{p:'raincoat',w:'pillow',o:N(['charger','raincoat','washbag']),a:1},
{p:'toothbrush',w:'soap',o:N(['passport','guidebook','toothbrush']),a:2},{p:'passport',w:'suitcase',o:N(['passport','umbrella','charger']),a:0},{p:'charger',w:'washbag',o:N(['pillow','charger','raincoat']),a:1}]},
{n:'6 · Final task',min:4,type:'cloze'}];
const M=[['I’ll need a ___ for my phone.','charger'],['You should wear your ___ if you’re going to the beach.','flip-flops'],['I always carry an ___ when the weather is wet.','umbrella'],['We’ll need to take some ___ if we feel ill during the trip.','medicines'],['You should read a ___ so you know what to do when you arrive on holiday.','guidebook'],['I always carry my shampoo and soap in my ___.','washbag']];
const T=['umbrella','charger','washbag','medicines','flip-flops','guidebook'];
const C={t:'Omar is packing for a trip. He puts his {0} (1) in the washbag to clean his teeth. He takes some {1} (2) to wash his body in the shower. It is wet, so he carries his {2} (3). He needs his {3} (4) for his phone. On the plane, he uses a {4} (5) to sleep. He is very happy!',o:[['passport','toothbrush','raincoat'],['soap','passport','raincoat'],['pillow','soap','umbrella'],['flip-flops','charger','guidebook'],['passport','pillow','suitcase']],a:[1,0,2,1,1]};
let S={step:0,st:A.map(()=>({i:0,pk:null,sc:0,done:false,lv:0,sel:null,m:{},sh:null,ans:{},chk:false}))};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784],.12,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);S.step=k;render();if(A[k].teach)speakT()}
function speakT(){const s=S.st[S.step],q=A[S.step].q[s.i];if(q&&q.w)say('This is a '+q.w+'.')}
function pick(i){const s=S.st[S.step],a=A[S.step],q=a.q[s.i];if(s.pk!==null)return;s.pk=i;const ok=i===q.a;if(ok){s.sc++;GOOD()}else BAD();say(q.o[q.a].t);render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null;s.lv=0;render();if(a.teach)speakT()}else{s.done=true;tone([523,659,784,1047],.14,'triangle');render()}}
function look(){const s=S.st[S.step];if(s.lv<2){s.lv++;tone([440+s.lv*100],.1)}render()}
function retry(){const k=S.step;S.st[k]={i:0,pk:null,sc:0,done:false,lv:0,sel:null,m:{},sh:null,ans:{},chk:false};tone([440,523],.1);render()}
function selS(i){const s=S.st[2];if(s.m[i])return;s.sel=i;tone([600],.08);render()}
function selT(k){const s=S.st[2];if(s.sel===null||Object.values(s.m).includes(k))return;if(M[s.sel][1]===T[k]){s.m[s.sel]=k;GOOD();say(M[s.sel][0].replace('___',T[k]));s.sel=null}else{BAD();s.sh=k;setTimeout(()=>{s.sh=null;render()},450)}render()}
function cl(g,i){const s=S.st[5];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[5];if(Object.keys(s.ans).length<5){BAD();return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s[1].sc+s[3].sc+s[4].sc+Object.keys(s[2].m).length+(s[5].chk?C.a.filter((a,g)=>s[5].ans[g]===a).length:0)+s[0].sc}
function mcHtml(a,s){
 const q=a.q[s.i],n=a.q.length,pk=s.pk,locked=pk!==null,ok=locked&&pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="q" style="text-align:center">Score: '+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Fantastic work!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button></div></div>';
 let pic='';
 if(a.type==='key'){const r=locked?60:[9,18,30][s.lv];pic='<div class="big"><svg width="190" height="190" viewBox="0 0 64 64" style="background:#0F2A43;border-radius:50%"><defs><clipPath id="kh"><circle cx="32" cy="32" r="'+r+'"/></clipPath></defs><circle cx="32" cy="32" r="31" fill="#0F2A43"/><g clip-path="url(#kh)"><rect width="64" height="64" fill="#fff"/><use href="#i-'+q.p+'"/></g><circle cx="32" cy="32" r="31" fill="none" stroke="#F5B700" stroke-width="2"/></svg></div>'}
 else if(q.p&&!(a.type==='mc'&&!a.info&&!a.teach))pic='<div class="big">'+ic(q.p,130)+'</div>';
 let pr=a.type==='key'?'What is behind the keyhole?':a.teach?'Teacher says: “This is a <b>'+q.w+'</b>.” <button class="o" style="display:inline-flex;padding:4px 12px;font-size:18px" onclick="speakT()">Listen</button><br>Correct the teacher! What is it?':(q.pr||'').replace('___',locked?'<b>'+q.o[q.a].t+'</b>':'______');
 const info=a.info?'<div class="learn"><b>I’m learning:</b> Describing everyday situations. You can learn new words better if you use them in sentences about everyday situations.</div>':'';
 const opts=q.o.map((o,i)=>'<button class="o'+(locked&&i===q.a?' ok':locked&&i===pk?' bad':'')+'" '+(locked?'disabled':'')+' onclick="pick('+i+')">'+(o.p?ic(o.p,46):'')+'<span>'+o.t+'</span></button>').join('');
 return '<div class="card">'+info+'<div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+'</span></div>'+pic+'<div class="q">'+pr+'</div>'+(a.type==='key'&&!locked?'<div class="row" style="justify-content:center"><button class="go alt" onclick="look()" '+(s.lv>=2?'disabled':'')+'>Look closer</button></div>':'')+'<div class="grid">'+opts+'</div><div class="fb">'+(locked?(ok?'Great job!':'Not quite.')+' The answer is: '+q.o[q.a].t:'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(locked?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function matchHtml(a,s){
 const L=M.map((m,i)=>'<button class="s'+(s.sel===i?' sel':'')+(s.m[i]!==undefined?' done':'')+'" onclick="selS('+i+')">'+(i+1)+'. '+m[0].replace('___',s.m[i]!==undefined?'<b>'+T[s.m[i]]+'</b>':'______')+'</button>').join('');
 const tl=T.map((w,k)=>'<button class="t'+(Object.values(s.m).includes(k)?' done':'')+(s.sh===k?' shake':'')+'" onclick="selT('+k+')">'+ic(w,64)+'<br>'+'ABCDEF'[k]+'</button>').join('');
 const all=Object.keys(s.m).length===6;
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Matched: '+Object.keys(s.m).length+' / 6</span></div><h2>Read and match. Tap a sentence, then tap the correct picture.</h2><div class="mt"><div>'+L+'</div><div class="tiles">'+tl+'</div></div><div class="fb">'+(all?'Excellent! All matched!':'')+'</div>'+(all?'<div class="row"><button class="go alt" onclick="retry()">Play again</button></div>':'')+'</div>'}
function clozeHtml(a,s){
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>';
 const txt=C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i));
 const rows=C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i;const cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('');
 const n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>'+a.n+' · Grammar / Vocabulary</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+txt+'</div>'+rows+'<div class="row"><b style="font-size:26px;color:#E8553D;margin-right:auto">'+(s.chk?'Score: '+n+' / 5':'')+'</b><span>'+(s.chk?(n===5?'Excellent!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}
function render(){
 document.getElementById('nav').innerHTML='<span>Start with any part:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');
 document.getElementById('stars').textContent='Stars: '+stars();
 const a=A[S.step],s=S.st[S.step];
 document.getElementById('main').innerHTML=a.type==='match'?matchHtml(a,s):a.type==='cloze'?clozeHtml(a,s):mcHtml(a,s)+(S.step===4&&s.done?'<div class="credit" style="margin-top:8px">Created by T.Badria Alfalahi</div>':'');
}
render();
</script></body></html>
